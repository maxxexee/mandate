[package]
name = "mandate-devnet"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

# Separate workspace: the program pins Rust 1.89 for the SBF toolchain, while
# the RPC client needs 1.98 or newer.
[workspace]

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"
mandate = { path = "../../programs/mandate", features = ["no-entrypoint"] }
solana-commitment-config = "3.1"
solana-keypair = "4"
solana-message = "5"
solana-program-pack = "3.1"
solana-rpc-client = "4.4"
solana-signer = "4"
solana-transaction = { version = "5", features = ["wincode"] }
